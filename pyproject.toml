[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postbop"
version = "0.1.0"
description = "A small native Ubuntu utility for quickly sending content into a Buffer social publishing workflow."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "10T Web Design" }
]

[project.scripts]
postbop = "postbop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]